<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090c14">
<title>Nexora • Admin</title>
<style>
:root{--bg:#090c14;--card:#121725;--card2:#181e2e;--text:#f7f8fc;--muted:#9ea7bc;--line:#252d41;--a:#6d5dfc;--b:#4da3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:#090c14ed;border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}
.head,.wrap{max-width:1200px;margin:auto;padding:16px 18px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand{font-size:23px;font-weight:900}.muted{color:var(--muted)}
.btn,.primary,.danger{padding:10px 14px;border-radius:12px;font-weight:800}
.btn{background:var(--card2);color:#fff;border:1px solid var(--line)}.primary{background:linear-gradient(100deg,var(--a),var(--b));color:#fff;border:0}.danger{background:#29151b;color:#ff9eaa;border:1px solid #6b2733}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:20px 0}.stat,.item,.login,.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px}
.stat{padding:17px}.stat b{display:block;font-size:30px;margin-top:5px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select{padding:11px}
input,select,textarea{background:#0a0e17;color:#fff;border:1px solid var(--line);border-radius:11px;padding:11px}
.table{overflow:hidden;border:1px solid var(--line);border-radius:18px}.item{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px;display:flex;gap:14px;justify-content:space-between;align-items:center}
.info{flex:1}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#252c40;font-size:12px;font-weight:800}.pending{background:#352a17;color:#f4d28a}.approved{background:#143125;color:#7ce8ac}.rejected{background:#341a22;color:#ff9ba8}
.actions{display:flex;gap:7px;flex-wrap:wrap}.login{max-width:500px;margin:15vh auto;padding:24px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:30}.modal.show{display:flex}
.sheet{width:min(680px,100%);padding:20px;max-height:90vh;overflow:auto}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:100px;resize:vertical}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:12px 15px;border-radius:12px;display:none;font-weight:800;z-index:50}
@media(max-width:650px){.item{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}.head{padding:12px}.wrap{padding:0 12px}}
</style>
</head>
<body>
<header><div class="head"><div><div class="brand">Nexora Admin</div><div class="muted" id="who">Checking access...</div></div><button class="btn" onclick="logout()">Sign out</button></div></header>

<main class="wrap">
<section id="login" class="login">
<h1>Admin access</h1><p class="muted">Sign in with the authorized Google account.</p>
<button class="primary" style="width:100%" onclick="login()">Continue with Google</button>
</section>

<section id="dash" style="display:none">
<h1>Dashboard</h1>
<div class="cards">
<div class="stat">Total apps<b id="total">0</b></div>
<div class="stat">Pending<b id="pending">0</b></div>
<div class="stat">Approved<b id="approved">0</b></div>
<div class="stat">Rejected<b id="rejected">0</b></div>
</div>
<div class="toolbar">
<input id="q" placeholder="Search app/developer">
<select id="status"><option value="all">All</option><option value="pending">pending</option><option value="approved">approved</option><option value="rejected">rejected</option></select>
<button class="btn" onclick="location.href='index.html'">Open Store</button>
</div>
<div class="table" id="list"></div>
</section>
</main>

<div id="modal" class="modal"><div class="sheet">
<button class="btn" style="float:right" onclick="closeEdit()">✕</button><h2>Edit app</h2>
<form id="edit">
<input type="hidden" id="id">
<div class="field"><label>Name</label><input id="n" required></div>
<div class="field"><label>Developer</label><input id="d" required></div>
<div class="field"><label>Category</label><select id="c"><option>Education</option><option>Games</option><option>Tools</option><option>Productivity</option><option>Social</option><option>Entertainment</option><option>Other</option></select></div>
<div class="field"><label>Icon URL</label><input id="i" type="url"></div>
<div class="field"><label>Download URL</label><input id="u" type="url" required></div>
<div class="field"><label>Version</label><input id="v"></div>
<div class="field"><label>Size</label><input id="z"></div>
<div class="field"><label>Description</label><textarea id="x"></textarea></div>
<div class="field"><label>Status</label><select id="s"><option>pending</option><option>approved</option><option>rejected</option></select></div>
<button class="primary">Save changes</button>
</form></div></div>
<div id="toast" class="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithRedirect,getRedirectResult,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getFirestore,collection,onSnapshot,doc,updateDoc,deleteDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDPT1RO7G4X_MCBu5yUnxd5pzA5JzbNmnU",
  authDomain: "nexora-d43be.firebaseapp.com",
  projectId: "nexora-d43be",
  storageBucket: "nexora-d43be.firebasestorage.app",
  messagingSenderId: "798522694457",
  appId: "1:798522694457:web:27caf64f0c371e02fe26e8",
  measurementId: "G-CXPK4FJ7RB"
};

const ADMIN_EMAILS=["dhannjayuphade5@gmail.com"];
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
let me=null,apps=[];
const allowed=u=>!!u?.email&&ADMIN_EMAILS.includes(u.email.toLowerCase());
const toast=m=>{$("toast").textContent=m;$("toast").style.display="block";clearTimeout(window.__t);window.__t=setTimeout(()=>$("toast").style.display="none",3000)};

async function login(){try{await signInWithRedirect(auth,provider)}catch(e){console.error(e);toast("Google login failed: "+(e.message||e.code||"Unknown error"))}}
window.login=login;window.logout=()=>signOut(auth);

async function handleRedirectResult(){
 try{await getRedirectResult(auth)}
 catch(e){
  console.error(e);
  if(e.code==="auth/unauthorized-domain")toast("Add dhannjayuphade.github.io to Firebase Authorized domains.");
  else if(e.code==="auth/api-key-not-valid-please-pass-a-valid-api-key")toast("Firebase API key invalid.");
  else toast("Google login failed: "+(e.message||e.code||"Unknown error"));
 }
}

onAuthStateChanged(auth,u=>{
 me=u;
 if(u&&allowed(u)){
  $("login").style.display="none";$("dash").style.display="block";$("who").textContent=u.email;render();
 }else{
  $("login").style.display="block";$("dash").style.display="none";
  $("who").textContent=u?`Access denied: ${u.email}`:"Not signed in";
  if(u)toast("This account is not an authorized admin.");
 }
});

onSnapshot(collection(db,"apps"),s=>{apps=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{console.error(e);toast("Cannot read apps. Check Firestore rules.")});

function render(){
 if(!allowed(me))return;
 const cnt={total:apps.length,pending:0,approved:0,rejected:0};
 apps.forEach(a=>{if(cnt[a.status]!=null)cnt[a.status]++});
 $("total").textContent=cnt.total;$("pending").textContent=cnt.pending;$("approved").textContent=cnt.approved;$("rejected").textContent=cnt.rejected;
 const q=$("q").value.toLowerCase(),st=$("status").value;
 const list=apps.filter(a=>(st==="all"||a.status===st)&&(!q||[a.name,a.developer,a.category].some(v=>String(v||"").toLowerCase().includes(q))));
 $("list").innerHTML=list.length?list.map(a=>`
 <div class="item"><div class="info"><h3>${esc(a.name||"Untitled")}</h3>
 <div class="muted">${esc(a.developer||"")} • ${esc(a.category||"Other")} • v${esc(a.version||"1.0.0")}</div>
 <small class="muted">${esc(a.submittedByEmail||"")}</small><br>
 <span class="badge ${esc(a.status||"pending")}">${esc(a.status||"pending")}</span></div>
 <div class="actions"><button class="btn" onclick="editApp('${esc(a.id)}')">Edit</button>
 ${a.status!=="approved"?`<button class="primary" onclick="setStatus('${esc(a.id)}','approved')">Approve</button>`:""}
 ${a.status!=="rejected"?`<button class="danger" onclick="setStatus('${esc(a.id)}','rejected')">Reject</button>`:""}
 <button class="danger" onclick="removeApp('${esc(a.id)}')">Delete</button></div></div>`).join("")
 :`<div style="padding:45px;text-align:center" class="muted">No apps found.</div>`;
}
$("q").oninput=render;$("status").onchange=render;

window.setStatus=async(id,status)=>{
 if(!allowed(me))return;
 try{await updateDoc(doc(db,"apps",id),{status,updatedAt:serverTimestamp(),reviewedBy:me.email});toast(status==="approved"?"Approved":"Rejected")}
 catch(e){console.error(e);toast("Update failed. Check Firestore rules.")}
};

window.removeApp=async id=>{
 if(!allowed(me))return;
 const a=apps.find(x=>x.id===id);
 if(!confirm(`Delete "${a?.name||"this app"}"?`))return;
 try{await deleteDoc(doc(db,"apps",id));toast("Deleted")}
 catch(e){console.error(e);toast("Delete failed.")}
};

window.editApp=id=>{
 const a=apps.find(x=>x.id===id);if(!a)return;
 $("id").value=id;$("n").value=a.name||"";$("d").value=a.developer||"";$("c").value=a.category||"Other";
 $("i").value=a.iconUrl||"";$("u").value=a.downloadUrl||"";$("v").value=a.version||"1.0.0";$("z").value=a.size||"";
 $("x").value=a.description||"";$("s").value=a.status||"pending";$("modal").classList.add("show");
};
window.closeEdit=()=>$("modal").classList.remove("show");

$("edit").onsubmit=async e=>{
 e.preventDefault();if(!allowed(me))return;
 try{
  await updateDoc(doc(db,"apps",$("id").value),{
   name:$("n").value.trim(),developer:$("d").value.trim(),category:$("c").value,
   iconUrl:$("i").value.trim(),downloadUrl:$("u").value.trim(),version:$("v").value.trim(),
   size:$("z").value.trim(),description:$("x").value.trim(),status:$("s").value,
   updatedAt:serverTimestamp(),reviewedBy:me.email
  });
  closeEdit();toast("Updated");
 }catch(e){console.error(e);toast("Save failed. Check Firestore rules.")}
};

handleRedirectResult();
</script>
</body>
</html>
